<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rima Sarkar | History</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            line-height: 1.6;
            color: #222;
            background-color: #ffffff;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
        }

        .container {
            max-width: 700px;
            width: 90%;
            padding: 60px 20px;
            text-align: left;
        }

        header {
            display: flex;
            align-items: center;
            gap: 40px;
            margin-bottom: 50px;
        }

        .profile-pic {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            overflow: hidden;
            border: 1px solid #ddd;
            flex-shrink: 0;
        }

        .profile-pic img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .header-info h1 {
            margin: 0;
            font-size: 2.2rem;
            letter-spacing: -0.5px;
        }

        .qualifications {
            margin: 10px 0;
            color: #666;
            font-size: 1.05rem;
        }

        .top-links {
            margin-top: 15px;
        }

        .top-links a {
            text-decoration: none;
            color: #1DA1F2; /* X/Twitter Blue */
            margin-right: 15px;
            font-weight: 500;
        }

        section {
            margin-bottom: 50px;
        }

        h2 {
            font-size: 1.4rem;
            border-bottom: 1px solid #eee;
            padding-bottom: 8px;
            margin-bottom: 20px;
            color: #444;
        }

        .about-text {
            text-align: justify;
            color: #333;
        }

        .tweet-wrapper {
            margin-bottom: 20px;
            display: flex;
            justify-content: center;
        }

        footer {
            text-align: center;
            margin-top: 80px;
            padding: 40px 0;
            border-top: 1px solid #f0f0f0;
        }

        .footer-thank-you {
            font-size: 1.2rem;
            margin-bottom: 15px;
            font-weight: 500;
        }

        .footer-links a {
            display: block;
            text-decoration: none;
            color: #333;
            margin: 8px 0;
            font-weight: 500;
            transition: color 0.2s;
        }

        .footer-links a:hover {
            color: #1DA1F2;
        }

        @media (max-width: 600px) {
            header {
                flex-direction: column;
                text-align: center;
            }
            .container { padding: 40px 20px; }
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <div class="profile-pic">
            <img src="Profile_Rima.jpeg" alt="Rima Sarkar">
        </div>
        <div class="header-info">
            <h1>Rima Sarkar</h1>
            <p class="qualifications">
                UGC NET (2025)<br>
                M.A. Modern History, B.A (Hons) History<br>
                University of Calcutta
            </p>
            <div class="top-links">
                <a href="https://twitter.com/_RimaSarkar" target="_blank">X Link</a>
                <a href="https://www.linkedin.com/in/rima-sarkar-720b96376/" target="_blank">LinkedIn</a>
                <a href="mailto:rimasarkar1301@gmail.com">Email</a>
            </div>
        </div>
    </header>

    <footer>
        <div class="footer-thank-you">Thank You</div>
        <div class="footer-links">
            <a href="https://twitter.com/_RimaSarkar" target="_blank">Follow me at X</a>
            <a href="mailto:.com">Connect at Mail</a>
        </div>
    </footer>
</div>

</body>
</html>
